name: goen
description: "碁縁（GoEn）- Premium adult Go learning app with beautiful design, beginner-friendly onboarding, and AI-explained game observation."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0

  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^4.14.0
  cloud_functions: ^4.5.0
  firebase_analytics: ^10.7.0
  firebase_crashlytics: ^3.4.0
  firebase_remote_config: ^4.3.0

  # Monetization
  in_app_purchase: ^3.3.0

  # UI & Animation
  lottie: ^2.7.0

  # Utilities
  uuid: ^4.0.0
  logger: ^2.2.0
  connectivity_plus: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.3.0
  build_runner: ^2.4.0
  mocktail: ^1.0.0

flutter:
  uses-material-design: true

  # Assets for UI
  assets:
    - assets/images/
    - assets/animations/
    - assets/sounds/
    - assets/fonts/

  # Custom fonts if needed
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/CustomFont-Regular.ttf
