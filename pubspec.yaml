name: goen
description: "碁縁（GoEn）- Premium adult Go learning app with beautiful design, beginner-friendly onboarding, and AI-explained game observation."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0

  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  cloud_functions: ^4.5.0
  firebase_analytics: ^10.7.0
  firebase_crashlytics: ^3.4.0
  firebase_remote_config: ^4.3.0

  # Monetization
  in_app_purchase: ^3.3.0

  # UI & Animation
  lottie: ^2.7.0
  google_fonts: ^6.1.0

  # Utilities
  uuid: ^4.0.0
  logger: ^2.2.0
  collection: ^1.18.0
  connectivity_plus: ^6.0.0
  http: ^1.1.0
  shared_preferences: ^2.2.0
  ffi: ^2.1.0

  # Social Sharing
  share_plus: ^7.2.0
  url_launcher: ^6.2.0

  # Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.16.1
  mocktail: ^1.0.0
  mockito: ^5.4.4
  freezed: ^4.0.2
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true

  # Assets for UI
  assets:
    - assets/images/
    - assets/animations/
    - assets/sounds/
    - assets/fonts/

  # Custom fonts if needed
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/CustomFont-Regular.ttf
