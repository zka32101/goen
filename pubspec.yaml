name: goen
description: "碁縁（GoEn）- Premium adult Go learning app with beautiful design, beginner-friendly onboarding, and AI-explained game observation."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0

  # Firebase
  firebase_core: ^4.13.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.8.0
  cloud_functions: ^6.3.0
  firebase_analytics: ^12.3.0
  firebase_crashlytics: ^5.2.0
  firebase_remote_config: ^6.5.0

  # Monetization
  # in_app_purchase: ^3.3.0  # TODO: Fix Kotlin compatibility

  # UI & Animation
  lottie: ^2.7.0

  # Utilities
  uuid: ^4.0.0
  logger: ^2.2.0
  connectivity_plus: ^6.0.0
  http: ^1.1.0
  shared_preferences: ^2.2.0

  # Social Sharing
  # share_plus: ^7.2.0  # TODO: Fix Kotlin compatibility
  # url_launcher: ^6.2.0  # TODO: Fix Kotlin compatibility (drive mismatch issue)

  # Serialization
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.3.0
  build_runner: ^2.4.0
  mocktail: ^1.0.0
  freezed: ^2.5.0
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true

  # Assets for UI
  assets:
    - assets/images/
    - assets/animations/
    - assets/sounds/
    - assets/fonts/

  # Custom fonts if needed
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/CustomFont-Regular.ttf
