org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=1
kotlin.incremental=false
kotlin.incremental.js=false
android.compileSdkVersion=36
android.useAndroidX=true
android.overridePathCheck=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Android Signing Configuration
# Load from environment variables (recommended)
# Set these via:
#   $env:ANDROID_KEYSTORE_PATH = "path/to/keystore"
#   $env:ANDROID_KEYSTORE_PASSWORD = "password"
#   $env:ANDROID_KEY_ALIAS = "alias"
#   $env:ANDROID_KEY_PASSWORD = "password"
# NEVER commit sensitive passwords to version control
ANDROID_KEYSTORE_PATH=${ANDROID_KEYSTORE_PATH}
ANDROID_KEYSTORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}
ANDROID_KEY_ALIAS=${ANDROID_KEY_ALIAS}
ANDROID_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}
